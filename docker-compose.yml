version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: portfolio_mongo
    # Single-node replica set: dividend imports use multi-document
    # transactions (DD-005 §2.6), which need one.
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: portfolio
    healthcheck:
      # Initiates the set on first boot; healthy once this node is PRIMARY.
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongodb:27017'}]}).ok }"]
      interval: 5s
      timeout: 10s
      retries: 20

  # Gold tracking data (PRD-003 / DD-003) lives in Postgres.
  postgres:
    image: postgres:17-alpine
    container_name: portfolio_postgres
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: portfolio
      POSTGRES_DB: portfolio
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio -d portfolio"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: portfolio_backend
    ports:
      - "8080:8080"
    environment:
      MONGODB_URI: mongodb://mongodb:27017/portfolio?replicaSet=rs0
      POSTGRES_URI: postgres://portfolio:portfolio@postgres:5432/portfolio?sslmode=disable
      PORT: 8080
    depends_on:
      mongodb:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: portfolio_frontend
    ports:
      - "3000:80"
    environment:
      VITE_API_URL: http://localhost:8080
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mongo_data:
    driver: local
  pg_data:
    driver: local

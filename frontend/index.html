<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Opt into the OS text-size setting: supporting browsers scale 1rem
         with it, so rem-sized stylesheet text follows. Never set a root
         font-size, or the scaling is overridden. -->
    <meta name="text-scale" content="scale" />
    <!-- Both schemes are supported, so until the stylesheet loads the
         canvas follows the OS preference: dark for a dark OS, white for a
         light one. tokens.css then sets each theme's own scheme. -->
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0a0c16" />
    <title>Portfolio Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Every Branding font (PD-059). The stylesheet only declares faces; the
         browser downloads the files of the font the deployment applies. -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Source+Sans+3:wght@400;500;600;700&family=Lato:wght@400;700&family=Nunito+Sans:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=Open+Sans:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

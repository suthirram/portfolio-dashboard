version: '3.8'

# Development mode: only the databases in Docker
# Run backend with: cd backend && go run . serve
# Run frontend with: cd frontend && npm run dev

services:
  mongodb:
    image: mongo:7
    container_name: portfolio_mongo_dev
    ports:
      - "27017:27017"
    volumes:
      - mongo_data_dev:/data/db
    environment:
      MONGO_INITDB_DATABASE: portfolio

  # Gold tracking data (PRD-003 / DD-003) lives in Postgres.
  postgres:
    image: postgres:17-alpine
    container_name: portfolio_postgres_dev
    ports:
      - "5432:5432"
    volumes:
      - pg_data_dev:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: portfolio
      POSTGRES_DB: portfolio

volumes:
  mongo_data_dev:
    driver: local
  pg_data_dev:
    driver: local

# Pulls MONGODB_URI out of Google Secret Manager via the GKE Secret Manager
# add-on (enable with `gcloud container clusters update --enable-secret-manager`,
# provider: gke). The CSI volume must be mounted by a pod for the sync to run;
# `secretObjects` then projects the fetched value into a regular Kubernetes
# Secret named `backend-secrets`, which the Deployment/CronJob consume as an env
# var via secretKeyRef. Auth is Workload Identity — no key material in git.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: backend-secrets
  namespace: portfolio
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/PROJECT_ID/secrets/MONGODB_URI/versions/latest"
        path: "mongodb-uri"
  secretObjects:
    - secretName: backend-secrets
      type: Opaque
      data:
        - objectName: "mongodb-uri"
          key: MONGODB_URI

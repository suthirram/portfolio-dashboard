# Kubernetes ServiceAccount the backend + snapshot pods run as. The annotation
# binds it to a GCP service account via Workload Identity, so pods authenticate
# to Google APIs (Secret Manager) with no exported key. The GCP SA email is
# patched per-environment; provision.sh creates the SA and the IAM bindings.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: portfolio
  namespace: portfolio
  annotations:
    # Replace PROJECT_ID via the overlay / provision step.
    iam.gke.io/gcp-service-account: pd-gke-sa@PROJECT_ID.iam.gserviceaccount.com

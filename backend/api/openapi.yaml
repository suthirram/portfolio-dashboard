openapi: 3.0.3
info:
  title: Portfolio Dashboard API
  description: |
    REST API for managing a stock/ETF portfolio.
    Live prices are fetched from Yahoo Finance (supports NSE `.NS`, BSE `.BO`, and US symbols).

    The spec is split by domain across sibling files in this directory:
    `holdings.yaml`, `market.yaml`, `auth.yaml`, `admin.yaml` for paths;
    `schemas.yaml`, `responses.yaml`, `parameters.yaml`, `security.yaml` for components.
  version: 1.0.0
  contact:
    email: mailstosuthir@gmail.com

servers:
  - url: http://localhost:8080/api
    description: Local development

security:
  - cookieAuth: []

tags:
  - name: Holdings
    description: CRUD operations for portfolio positions (scoped to the logged-in user)
  - name: Market
    description: Live price and forex endpoints
  - name: Auth
    description: Signup, login, session, profile, and password recovery
  - name: Admin
    description: Region-scoped user oversight (admin) and admin management (super admin)

paths:
  /holdings:
    $ref: "./holdings.yaml#/holdings"
  /holdings/{id}:
    $ref: "./holdings.yaml#/holdings_id"
  /prices:
    $ref: "./holdings.yaml#/prices"
  /summary:
    $ref: "./holdings.yaml#/summary"

  /market/price:
    $ref: "./market.yaml#/price"
  /market/forex:
    $ref: "./market.yaml#/forex"

  /regions:
    $ref: "./auth.yaml#/regions"
  /auth/security-questions:
    $ref: "./auth.yaml#/security_questions"
  /auth/signup:
    $ref: "./auth.yaml#/signup"
  /auth/login:
    $ref: "./auth.yaml#/login"
  /auth/logout:
    $ref: "./auth.yaml#/logout"
  /auth/me:
    $ref: "./auth.yaml#/me"
  /auth/recover/questions:
    $ref: "./auth.yaml#/recover_questions"
  /auth/recover:
    $ref: "./auth.yaml#/recover"
  /auth/password:
    $ref: "./auth.yaml#/password"
  /auth/profile:
    $ref: "./auth.yaml#/profile"
  /auth/security-questions/answers:
    $ref: "./auth.yaml#/security_questions_answers"
  /auth/onboarding:
    $ref: "./auth.yaml#/onboarding"

  /admin/users:
    $ref: "./admin.yaml#/users"
  /admin/admins:
    $ref: "./admin.yaml#/admins"
  /admin/users/{id}:
    $ref: "./admin.yaml#/users_id"
  /admin/users/{id}/reset-lockout:
    $ref: "./admin.yaml#/users_id_reset_lockout"
  /admin/users/{id}/hide:
    $ref: "./admin.yaml#/users_id_hide"
  /admin/users/{id}/reactivate:
    $ref: "./admin.yaml#/users_id_reactivate"
  /admin/users/{id}/promote:
    $ref: "./admin.yaml#/users_id_promote"
  /admin/users/{id}/demote:
    $ref: "./admin.yaml#/users_id_demote"
  /admin/users/{id}/region:
    $ref: "./admin.yaml#/users_id_region"
  /admin/users/{id}/holdings:
    $ref: "./admin.yaml#/users_id_holdings"
  /admin/users/{id}/holdings/{holdingId}:
    $ref: "./admin.yaml#/users_id_holdings_holdingid"
  /admin/users/{id}/prices:
    $ref: "./admin.yaml#/users_id_prices"
  /admin/users/{id}/summary:
    $ref: "./admin.yaml#/users_id_summary"

components:
  parameters:
    UserID:
      $ref: "./parameters.yaml#/UserID"

  securitySchemes:
    cookieAuth:
      $ref: "./security.yaml#/cookieAuth"

  schemas:
    Region:
      $ref: "./schemas.yaml#/Region"
    SecurityQuestion:
      $ref: "./schemas.yaml#/SecurityQuestion"
    SecurityAnswerInput:
      $ref: "./schemas.yaml#/SecurityAnswerInput"
    User:
      $ref: "./schemas.yaml#/User"
    SignupRequest:
      $ref: "./schemas.yaml#/SignupRequest"
    LoginRequest:
      $ref: "./schemas.yaml#/LoginRequest"
    RecoverQuestionsRequest:
      $ref: "./schemas.yaml#/RecoverQuestionsRequest"
    RecoverRequest:
      $ref: "./schemas.yaml#/RecoverRequest"
    ChangePasswordRequest:
      $ref: "./schemas.yaml#/ChangePasswordRequest"
    UpdateProfileRequest:
      $ref: "./schemas.yaml#/UpdateProfileRequest"
    UpdateSecurityQuestionsRequest:
      $ref: "./schemas.yaml#/UpdateSecurityQuestionsRequest"
    OnboardingRequest:
      $ref: "./schemas.yaml#/OnboardingRequest"
    RegionUpdateRequest:
      $ref: "./schemas.yaml#/RegionUpdateRequest"
    Holding:
      $ref: "./schemas.yaml#/Holding"
    HoldingInput:
      $ref: "./schemas.yaml#/HoldingInput"
    HoldingWithPrice:
      $ref: "./schemas.yaml#/HoldingWithPrice"
    PricesResponse:
      $ref: "./schemas.yaml#/PricesResponse"
    Summary:
      $ref: "./schemas.yaml#/Summary"
    Error:
      $ref: "./schemas.yaml#/Error"

  responses:
    BadRequest:
      $ref: "./responses.yaml#/BadRequest"
    Unauthorized:
      $ref: "./responses.yaml#/Unauthorized"
    Forbidden:
      $ref: "./responses.yaml#/Forbidden"
    Conflict:
      $ref: "./responses.yaml#/Conflict"
    Locked:
      $ref: "./responses.yaml#/Locked"
    NotFound:
      $ref: "./responses.yaml#/NotFound"
    BadGateway:
      $ref: "./responses.yaml#/BadGateway"

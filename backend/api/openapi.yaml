openapi: 3.0.3
info:
  title: Portfolio Dashboard API
  description: |
    REST API for managing a stock/ETF portfolio.
    Live prices are fetched from Yahoo Finance (supports NSE `.NS`, BSE `.BO`, and US symbols).
  version: 1.0.0
  contact:
    email: mailstosuthir@gmail.com

servers:
  - url: http://localhost:8080/api
    description: Local development

tags:
  - name: Holdings
    description: CRUD operations for portfolio positions
  - name: Market
    description: Live price and forex endpoints

paths:
  /holdings:
    get:
      tags: [Holdings]
      summary: List all holdings
      operationId: listHoldings
      responses:
        "200":
          description: Array of holdings sorted by script name
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Holding"

    post:
      tags: [Holdings]
      summary: Add a new holding
      operationId: createHolding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HoldingInput"
      responses:
        "201":
          description: Created holding
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Holding"
        "400":
          $ref: "#/components/responses/BadRequest"

  /holdings/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: MongoDB ObjectID

    get:
      tags: [Holdings]
      summary: Get a single holding
      operationId: getHolding
      responses:
        "200":
          description: Holding found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Holding"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      tags: [Holdings]
      summary: Update a holding
      operationId: updateHolding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HoldingInput"
      responses:
        "200":
          description: Updated holding
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Holding"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      tags: [Holdings]
      summary: Delete a holding
      operationId: deleteHolding
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: deleted
        "404":
          $ref: "#/components/responses/NotFound"

  /prices:
    get:
      tags: [Holdings]
      summary: Get all holdings enriched with live market prices
      description: |
        Fetches current prices from Yahoo Finance for every holding that has a
        `symbol` set. Also returns the live INR→EUR exchange rate.
        Results are cached for 5 minutes to avoid rate-limiting.
      operationId: getPrices
      responses:
        "200":
          description: Holdings with live prices
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PricesResponse"

  /summary:
    get:
      tags: [Holdings]
      summary: Portfolio-level summary with live P&L
      operationId: getSummary
      responses:
        "200":
          description: Aggregated portfolio metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Summary"

  /market/price:
    get:
      tags: [Market]
      summary: Get live price for any symbol
      operationId: getMarketPrice
      parameters:
        - name: symbol
          in: query
          required: true
          schema:
            type: string
          description: Yahoo Finance ticker (e.g. TCS.NS, AAPL, GOLDBEES.NS)
          example: TCS.NS
      responses:
        "200":
          description: Current price
          content:
            application/json:
              schema:
                type: object
                properties:
                  symbol:
                    type: string
                  price:
                    type: number
                  currency:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "502":
          $ref: "#/components/responses/BadGateway"

  /market/forex:
    get:
      tags: [Market]
      summary: Get forex exchange rate
      operationId: getForexRate
      parameters:
        - name: from
          in: query
          schema:
            type: string
            default: INR
        - name: to
          in: query
          schema:
            type: string
            default: EUR
      responses:
        "200":
          description: Exchange rate
          content:
            application/json:
              schema:
                type: object
                properties:
                  from:
                    type: string
                  to:
                    type: string
                  rate:
                    type: number
                    description: 1 unit of `from` in `to`

components:
  schemas:
    Holding:
      type: object
      properties:
        id:
          type: string
          description: MongoDB ObjectID
        script:
          type: string
          description: Display name (e.g. "TCS", "GOLD BEES")
        symbol:
          type: string
          description: Yahoo Finance ticker (e.g. "TCS.NS", "GOLDBEES.NS", "AAPL")
        exchange:
          type: string
          enum: [NSE, BSE, NYSE, NASDAQ, OTHER]
        type:
          type: string
          enum: [stock, etf]
        stocks_owned:
          type: number
          description: Current quantity held
        avg_cost_price:
          type: number
          description: Average purchase price per share (INR for Indian stocks)
        realized_pnl:
          type: number
          description: Profit/loss from shares already sold
        notes:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    HoldingInput:
      type: object
      required: [script, exchange, type]
      properties:
        script:
          type: string
        symbol:
          type: string
        exchange:
          type: string
          enum: [NSE, BSE, NYSE, NASDAQ, OTHER]
        type:
          type: string
          enum: [stock, etf]
        stocks_owned:
          type: number
          default: 0
        avg_cost_price:
          type: number
          default: 0
        realized_pnl:
          type: number
          default: 0
        notes:
          type: string

    HoldingWithPrice:
      allOf:
        - $ref: "#/components/schemas/Holding"
        - type: object
          properties:
            current_price:
              type: number
            cost_price:
              type: number
              description: stocks_owned × avg_cost_price
            current_value:
              type: number
              description: stocks_owned × current_price
            unrealized_pnl:
              type: number
              description: current_value − cost_price
            cost_price_eur:
              type: number
            current_value_eur:
              type: number
            unrealized_pnl_eur:
              type: number
            realized_pnl_eur:
              type: number
            price_error:
              type: string

    PricesResponse:
      type: object
      properties:
        holdings:
          type: array
          items:
            $ref: "#/components/schemas/HoldingWithPrice"
        eur_rate:
          type: number
          description: Live INR→EUR rate used for conversions

    Summary:
      type: object
      properties:
        total_cost:
          type: number
        total_current_value:
          type: number
        total_unrealized:
          type: number
        total_realized:
          type: number
        total_cost_eur:
          type: number
        total_current_value_eur:
          type: number
        total_unrealized_eur:
          type: number
        total_realized_eur:
          type: number
        eur_rate:
          type: number

    Error:
      type: object
      properties:
        error:
          type: string

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadGateway:
      description: Upstream (Yahoo Finance) error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

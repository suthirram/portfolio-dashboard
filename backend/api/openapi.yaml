openapi: 3.0.3
info:
  title: Portfolio Dashboard API
  description: |
    REST API for managing a stock/ETF portfolio.
    Live prices are fetched from Yahoo Finance (supports NSE `.NS`, BSE `.BO`, and US symbols).
  version: 1.0.0
  contact:
    email: mailstosuthir@gmail.com

servers:
  - url: http://localhost:8080/api
    description: Local development

security:
  - cookieAuth: []

tags:
  - name: Holdings
    description: CRUD operations for portfolio positions (scoped to the logged-in user)
  - name: Market
    description: Live price and forex endpoints
  - name: Auth
    description: Signup, login, session, profile, and password recovery
  - name: Admin
    description: Region-scoped user oversight (admin) and admin management (super admin)

paths:
  /holdings:
    get:
      tags: [Holdings]
      summary: List all holdings
      operationId: listHoldings
      responses:
        "200":
          description: Array of holdings sorted by script name
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Holding"

    post:
      tags: [Holdings]
      summary: Add a new holding
      operationId: createHolding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HoldingInput"
      responses:
        "201":
          description: Created holding
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Holding"
        "400":
          $ref: "#/components/responses/BadRequest"

  /holdings/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: MongoDB ObjectID

    get:
      tags: [Holdings]
      summary: Get a single holding
      operationId: getHolding
      responses:
        "200":
          description: Holding found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Holding"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      tags: [Holdings]
      summary: Update a holding
      operationId: updateHolding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HoldingInput"
      responses:
        "200":
          description: Updated holding
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Holding"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      tags: [Holdings]
      summary: Delete a holding
      operationId: deleteHolding
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: deleted
        "404":
          $ref: "#/components/responses/NotFound"

  /prices:
    get:
      tags: [Holdings]
      summary: Get all holdings enriched with live market prices
      description: |
        Fetches current prices from Yahoo Finance for every holding that has a
        `symbol` set. Also returns the live INR→EUR exchange rate.
        Results are cached for 5 minutes to avoid rate-limiting.
      operationId: getPrices
      responses:
        "200":
          description: Holdings with live prices
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PricesResponse"

  /summary:
    get:
      tags: [Holdings]
      summary: Portfolio-level summary with live P&L
      operationId: getSummary
      responses:
        "200":
          description: Aggregated portfolio metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Summary"

  /market/price:
    get:
      tags: [Market]
      summary: Get live price for any symbol
      operationId: getMarketPrice
      parameters:
        - name: symbol
          in: query
          required: true
          schema:
            type: string
          description: Yahoo Finance ticker (e.g. TCS.NS, AAPL, GOLDBEES.NS)
          example: TCS.NS
      responses:
        "200":
          description: Current price
          content:
            application/json:
              schema:
                type: object
                properties:
                  symbol:
                    type: string
                  price:
                    type: number
                    format: double
                  currency:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "502":
          $ref: "#/components/responses/BadGateway"

  /market/forex:
    get:
      tags: [Market]
      summary: Get forex exchange rate
      operationId: getForexRate
      parameters:
        - name: from
          in: query
          schema:
            type: string
            default: INR
        - name: to
          in: query
          schema:
            type: string
            default: EUR
      responses:
        "200":
          description: Exchange rate
          content:
            application/json:
              schema:
                type: object
                properties:
                  from:
                    type: string
                  to:
                    type: string
                  rate:
                    type: number
                    format: double
                    description: 1 unit of `from` in `to`

  /regions:
    get:
      tags: [Auth]
      summary: Region catalogue
      description: Fixed list of oversight regions for the signup dropdown.
      operationId: getRegions
      security: []
      responses:
        "200":
          description: Region catalogue
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Region"

  /auth/security-questions:
    get:
      tags: [Auth]
      summary: Security-question catalogue
      operationId: getSecurityQuestionCatalogue
      security: []
      responses:
        "200":
          description: Question catalogue
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SecurityQuestion"

  /auth/signup:
    post:
      tags: [Auth]
      summary: Create an account and log in
      operationId: signup
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupRequest"
      responses:
        "201":
          description: Account created; session cookie issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"

  /auth/login:
    post:
      tags: [Auth]
      summary: Log in with username and password
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Logged in; session cookie issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "423":
          $ref: "#/components/responses/Locked"

  /auth/logout:
    post:
      tags: [Auth]
      summary: Log out the current session
      operationId: logout
      responses:
        "204":
          description: Session invalidated; cookie cleared
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/me:
    get:
      tags: [Auth]
      summary: Current account
      operationId: getMe
      responses:
        "200":
          description: The logged-in account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/recover/questions:
    post:
      tags: [Auth]
      summary: Fetch the security questions for an account (forgot password, step 1)
      description: |
        Username travels in the body (not the URL) so it stays out of access logs.
      operationId: getRecoveryQuestions
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecoverQuestionsRequest"
      responses:
        "200":
          description: The three questions the account chose at signup
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SecurityQuestion"
        "404":
          $ref: "#/components/responses/NotFound"
        "423":
          $ref: "#/components/responses/Locked"

  /auth/recover:
    post:
      tags: [Auth]
      summary: Reset a forgotten password by answering all three security questions
      description: |
        Three wrong attempts lock recovery (HTTP 423) until someone authorised
        resets it: an admin for a user, the super admin for an admin.
      operationId: recoverPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecoverRequest"
      responses:
        "204":
          description: Password reset; all sessions invalidated
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "423":
          $ref: "#/components/responses/Locked"

  /auth/password:
    put:
      tags: [Auth]
      summary: Change own password
      description: Signs out all other sessions.
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: Password changed; other sessions invalidated
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/profile:
    put:
      tags: [Auth]
      summary: Change own name and/or username
      operationId: updateProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: Updated account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"

  /auth/security-questions/answers:
    put:
      tags: [Auth]
      summary: Replace own security questions and answers
      operationId: updateSecurityQuestions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSecurityQuestionsRequest"
      responses:
        "204":
          description: Security questions replaced
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/onboarding:
    post:
      tags: [Auth]
      summary: Complete forced first-login onboarding
      description: |
        Atomically sets a real password and three real security questions and
        clears `must_change_password`. Used by the bootstrap super admin.
      operationId: completeOnboarding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnboardingRequest"
      responses:
        "200":
          description: Onboarding complete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /admin/users:
    get:
      tags: [Admin]
      summary: List users the caller oversees
      description: |
        Admins see the `user` accounts of their own region; the super admin
        sees every account. Hidden users are excluded unless `include_hidden`.
      operationId: adminListUsers
      parameters:
        - name: include_hidden
          in: query
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Users in scope
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/admins:
    get:
      tags: [Admin]
      summary: List admins and the super admin (super admin only)
      operationId: adminListAdmins
      responses:
        "200":
          description: Accounts with role admin or superadmin
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/users/{id}:
    parameters:
      - $ref: "#/components/parameters/UserID"

    get:
      tags: [Admin]
      summary: Get one user in scope
      operationId: adminGetUser
      responses:
        "200":
          description: User found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      tags: [Admin]
      summary: Permanently delete a user and their holdings
      operationId: adminDeleteUser
      responses:
        "204":
          description: User and holdings deleted
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/users/{id}/reset-lockout:
    post:
      tags: [Admin]
      summary: Unlock a user who failed security-question recovery
      operationId: adminResetLockout
      parameters:
        - $ref: "#/components/parameters/UserID"
      responses:
        "204":
          description: Lockout cleared
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/users/{id}/hide:
    post:
      tags: [Admin]
      summary: Hide a user (reversibly block access, keep data)
      operationId: adminHideUser
      parameters:
        - $ref: "#/components/parameters/UserID"
      responses:
        "204":
          description: User hidden
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/users/{id}/reactivate:
    post:
      tags: [Admin]
      summary: Reactivate a hidden user
      operationId: adminReactivateUser
      parameters:
        - $ref: "#/components/parameters/UserID"
      responses:
        "204":
          description: User reactivated
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/users/{id}/promote:
    post:
      tags: [Admin]
      summary: Promote a user to admin of their region (super admin only)
      operationId: adminPromoteUser
      parameters:
        - $ref: "#/components/parameters/UserID"
      responses:
        "200":
          description: Updated account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/users/{id}/demote:
    post:
      tags: [Admin]
      summary: Demote an admin back to a normal user (super admin only)
      operationId: adminDemoteUser
      parameters:
        - $ref: "#/components/parameters/UserID"
      responses:
        "200":
          description: Updated account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/users/{id}/region:
    put:
      tags: [Admin]
      summary: Move an account to a different region (super admin only)
      operationId: adminSetUserRegion
      parameters:
        - $ref: "#/components/parameters/UserID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegionUpdateRequest"
      responses:
        "200":
          description: Updated account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/users/{id}/holdings:
    parameters:
      - $ref: "#/components/parameters/UserID"

    get:
      tags: [Admin]
      summary: List a user's holdings (act on their behalf)
      operationId: adminListUserHoldings
      responses:
        "200":
          description: The user's holdings sorted by script name
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Holding"
        "404":
          $ref: "#/components/responses/NotFound"

    post:
      tags: [Admin]
      summary: Add a holding to a user's portfolio
      operationId: adminCreateUserHolding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HoldingInput"
      responses:
        "201":
          description: Created holding
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Holding"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/users/{id}/holdings/{holdingId}:
    parameters:
      - $ref: "#/components/parameters/UserID"
      - name: holdingId
        in: path
        required: true
        schema:
          type: string
        description: MongoDB ObjectID of the holding

    put:
      tags: [Admin]
      summary: Update a holding in a user's portfolio
      operationId: adminUpdateUserHolding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HoldingInput"
      responses:
        "200":
          description: Updated holding
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Holding"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      tags: [Admin]
      summary: Delete a holding from a user's portfolio
      operationId: adminDeleteUserHolding
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: deleted
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/users/{id}/prices:
    get:
      tags: [Admin]
      summary: A user's holdings enriched with live prices
      operationId: adminGetUserPrices
      parameters:
        - $ref: "#/components/parameters/UserID"
      responses:
        "200":
          description: Holdings with live prices
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PricesResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/users/{id}/summary:
    get:
      tags: [Admin]
      summary: A user's portfolio summary
      operationId: adminGetUserSummary
      parameters:
        - $ref: "#/components/parameters/UserID"
      responses:
        "200":
          description: Aggregated portfolio metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Summary"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  parameters:
    UserID:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: MongoDB ObjectID of the target user

  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: pd_session
      description: Opaque server-side session id issued at signup/login

  schemas:
    Region:
      type: object
      required: [id, label]
      properties:
        id:
          type: string
          description: Stable region key (india, europe, us)
        label:
          type: string
          description: Display name

    SecurityQuestion:
      type: object
      required: [id, prompt]
      properties:
        id:
          type: string
          description: Stable question key from the fixed catalogue
        prompt:
          type: string

    SecurityAnswerInput:
      type: object
      required: [question_id, answer]
      properties:
        question_id:
          type: string
          description: Question key from the catalogue
        answer:
          type: string
          description: Answer text; compared case-insensitively, surrounding whitespace ignored

    User:
      type: object
      required: [id, username, name, role, region, disabled, locked, must_change_password]
      properties:
        id:
          type: string
          description: MongoDB ObjectID
        username:
          type: string
          description: Username as originally typed (uniqueness is case-insensitive)
        name:
          type: string
        role:
          type: string
          enum: [user, admin, superadmin]
        region:
          type: string
          description: Oversight region (india, europe, us); empty for the super admin
        disabled:
          type: boolean
          description: Hidden (reversibly blocked) by an admin
        locked:
          type: boolean
          description: Security-question recovery locked after three wrong attempts
        must_change_password:
          type: boolean
          description: Forced onboarding pending (bootstrap super admin)
        security_question_ids:
          type: array
          items:
            type: string
          description: The catalogue keys of the account's chosen questions (own account only)
        created_at:
          type: string
          format: date-time
        last_login_at:
          type: string
          format: date-time

    SignupRequest:
      type: object
      required: [username, name, password, region, security_answers]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 32
          description: "Allowed characters: A–Z a–z 0–9 _ -"
        name:
          type: string
          minLength: 1
          maxLength: 80
        password:
          type: string
          minLength: 8
        region:
          type: string
          description: One of the /regions catalogue ids
        security_answers:
          type: array
          minItems: 3
          maxItems: 3
          items:
            $ref: "#/components/schemas/SecurityAnswerInput"

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    RecoverQuestionsRequest:
      type: object
      required: [username]
      properties:
        username:
          type: string

    RecoverRequest:
      type: object
      required: [username, answers, new_password]
      properties:
        username:
          type: string
        answers:
          type: array
          minItems: 3
          maxItems: 3
          items:
            $ref: "#/components/schemas/SecurityAnswerInput"
        new_password:
          type: string
          minLength: 8

    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
        new_password:
          type: string
          minLength: 8

    UpdateProfileRequest:
      type: object
      required: [current_password]
      properties:
        current_password:
          type: string
        name:
          type: string
          minLength: 1
          maxLength: 80
        username:
          type: string
          minLength: 3
          maxLength: 32

    UpdateSecurityQuestionsRequest:
      type: object
      required: [current_password, security_answers]
      properties:
        current_password:
          type: string
        security_answers:
          type: array
          minItems: 3
          maxItems: 3
          items:
            $ref: "#/components/schemas/SecurityAnswerInput"

    OnboardingRequest:
      type: object
      required: [current_password, new_password, security_answers]
      properties:
        current_password:
          type: string
        new_password:
          type: string
          minLength: 8
        security_answers:
          type: array
          minItems: 3
          maxItems: 3
          items:
            $ref: "#/components/schemas/SecurityAnswerInput"

    RegionUpdateRequest:
      type: object
      required: [region]
      properties:
        region:
          type: string
          description: One of the /regions catalogue ids

    Holding:
      type: object
      properties:
        id:
          type: string
          description: MongoDB ObjectID
        script:
          type: string
          description: Display name (e.g. "TCS", "GOLD BEES")
        symbol:
          type: string
          description: Yahoo Finance ticker (e.g. "TCS.NS", "GOLDBEES.NS", "AAPL")
        exchange:
          type: string
          enum: [NSE, BSE, NYSE, NASDAQ, OTHER]
        type:
          type: string
          enum: [stock, etf]
        stocks_owned:
          type: number
          format: double
          description: Current quantity held
        avg_cost_price:
          type: number
          format: double
          description: Average purchase price per share in the holding's currency
        realized_pnl:
          type: number
          format: double
          description: Profit/loss from shares already sold, in the holding's currency
        currency:
          type: string
          enum: [INR, EUR]
          default: INR
          description: Currency in which avg_cost_price and realized_pnl are denominated
        notes:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    HoldingInput:
      type: object
      required: [script, exchange, type]
      properties:
        script:
          type: string
        symbol:
          type: string
        exchange:
          type: string
          enum: [NSE, BSE, NYSE, NASDAQ, OTHER]
        type:
          type: string
          enum: [stock, etf]
        stocks_owned:
          type: number
          format: double
          default: 0
        avg_cost_price:
          type: number
          format: double
          default: 0
        realized_pnl:
          type: number
          format: double
          default: 0
        currency:
          type: string
          enum: [INR, EUR]
          default: INR
          description: Currency in which avg_cost_price and realized_pnl are denominated
        notes:
          type: string

    HoldingWithPrice:
      allOf:
        - $ref: "#/components/schemas/Holding"
        - type: object
          properties:
            current_price:
              type: number
              format: double
            cost_price:
              type: number
              format: double
              description: stocks_owned × avg_cost_price
            current_value:
              type: number
              format: double
              description: stocks_owned × current_price
            unrealized_pnl:
              type: number
              format: double
              description: current_value − cost_price
            cost_price_eur:
              type: number
              format: double
            current_value_eur:
              type: number
              format: double
            unrealized_pnl_eur:
              type: number
              format: double
            realized_pnl_eur:
              type: number
              format: double
            price_error:
              type: string

    PricesResponse:
      type: object
      properties:
        holdings:
          type: array
          items:
            $ref: "#/components/schemas/HoldingWithPrice"
        eur_rate:
          type: number
          format: double
          description: Live INR→EUR rate used for conversions

    Summary:
      type: object
      properties:
        total_cost:
          type: number
          format: double
        total_current_value:
          type: number
          format: double
        total_unrealized:
          type: number
          format: double
        total_realized:
          type: number
          format: double
        total_cost_eur:
          type: number
          format: double
        total_current_value_eur:
          type: number
          format: double
        total_unrealized_eur:
          type: number
          format: double
        total_realized_eur:
          type: number
          format: double
        eur_rate:
          type: number
          format: double

    Error:
      type: object
      properties:
        error:
          type: string

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Not logged in, or credentials/answers rejected
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Logged in but not allowed (role, scope, or hidden account)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Username already taken
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Locked:
      description: Recovery locked after three wrong security-answer attempts
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadGateway:
      description: Upstream (Yahoo Finance) error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

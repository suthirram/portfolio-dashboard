BadRequest:
  description: Bad request
  content:
    application/json:
      schema:
        $ref: "./schemas.yaml#/Error"
Unauthorized:
  description: Not logged in, or credentials/answers rejected
  content:
    application/json:
      schema:
        $ref: "./schemas.yaml#/Error"
Forbidden:
  description: Logged in but not allowed (role, scope, or hidden account)
  content:
    application/json:
      schema:
        $ref: "./schemas.yaml#/Error"
Conflict:
  description: Username already taken
  content:
    application/json:
      schema:
        $ref: "./schemas.yaml#/Error"
Locked:
  description: Recovery locked after three wrong security-answer attempts
  content:
    application/json:
      schema:
        $ref: "./schemas.yaml#/Error"
NotFound:
  description: Resource not found
  content:
    application/json:
      schema:
        $ref: "./schemas.yaml#/Error"
BadGateway:
  description: Upstream (Yahoo Finance) error
  content:
    application/json:
      schema:
        $ref: "./schemas.yaml#/Error"

Region:
  type: object
  required: [id, label]
  properties:
    id:
      type: string
      description: Stable region key (india, europe, us)
    label:
      type: string
      description: Display name

SecurityQuestion:
  type: object
  required: [id, prompt]
  properties:
    id:
      type: string
      description: Stable question key from the fixed catalogue
    prompt:
      type: string

SecurityAnswerInput:
  type: object
  required: [question_id, answer]
  properties:
    question_id:
      type: string
      description: Question key from the catalogue
    answer:
      type: string
      description: Answer text; compared case-insensitively, surrounding whitespace ignored

User:
  type: object
  required: [id, username, name, role, region, disabled, locked, must_change_password]
  properties:
    id:
      type: string
      description: MongoDB ObjectID
    username:
      type: string
      description: Username as originally typed (uniqueness is case-insensitive)
    name:
      type: string
    role:
      type: string
      enum: [user, admin, superadmin]
    region:
      type: string
      description: Oversight region (india, europe, us); empty for the super admin
    disabled:
      type: boolean
      description: Hidden (reversibly blocked) by an admin
    locked:
      type: boolean
      description: Security-question recovery locked after three wrong attempts
    must_change_password:
      type: boolean
      description: Forced onboarding pending (bootstrap super admin)
    security_question_ids:
      type: array
      items:
        type: string
      description: The catalogue keys of the account's chosen questions (own account only)
    created_at:
      type: string
      format: date-time
    last_login_at:
      type: string
      format: date-time

SignupRequest:
  type: object
  required: [username, name, password, region, security_answers]
  properties:
    username:
      type: string
      minLength: 3
      maxLength: 32
      description: "Allowed characters: A–Z a–z 0–9 _ -"
    name:
      type: string
      minLength: 1
      maxLength: 80
    password:
      type: string
      minLength: 8
    region:
      type: string
      description: One of the /regions catalogue ids
    security_answers:
      type: array
      minItems: 3
      maxItems: 3
      items:
        $ref: "./schemas.yaml#/SecurityAnswerInput"

LoginRequest:
  type: object
  required: [username, password]
  properties:
    username:
      type: string
    password:
      type: string

RecoverQuestionsRequest:
  type: object
  required: [username]
  properties:
    username:
      type: string

RecoverRequest:
  type: object
  required: [username, answers, new_password]
  properties:
    username:
      type: string
    answers:
      type: array
      minItems: 3
      maxItems: 3
      items:
        $ref: "./schemas.yaml#/SecurityAnswerInput"
    new_password:
      type: string
      minLength: 8

ChangePasswordRequest:
  type: object
  required: [current_password, new_password]
  properties:
    current_password:
      type: string
    new_password:
      type: string
      minLength: 8

UpdateProfileRequest:
  type: object
  required: [current_password]
  properties:
    current_password:
      type: string
    name:
      type: string
      minLength: 1
      maxLength: 80
    username:
      type: string
      minLength: 3
      maxLength: 32

UpdateSecurityQuestionsRequest:
  type: object
  required: [current_password, security_answers]
  properties:
    current_password:
      type: string
    security_answers:
      type: array
      minItems: 3
      maxItems: 3
      items:
        $ref: "./schemas.yaml#/SecurityAnswerInput"

OnboardingRequest:
  type: object
  required: [current_password, new_password, security_answers]
  properties:
    current_password:
      type: string
    new_password:
      type: string
      minLength: 8
    security_answers:
      type: array
      minItems: 3
      maxItems: 3
      items:
        $ref: "./schemas.yaml#/SecurityAnswerInput"

RegionUpdateRequest:
  type: object
  required: [region]
  properties:
    region:
      type: string
      description: One of the /regions catalogue ids

Holding:
  type: object
  properties:
    id:
      type: string
      description: MongoDB ObjectID
    script:
      type: string
      description: Display name (e.g. "TCS", "GOLD BEES")
    symbol:
      type: string
      description: Yahoo Finance ticker (e.g. "TCS.NS", "GOLDBEES.NS", "AAPL")
    exchange:
      type: string
      enum: [NSE, BSE, NYSE, NASDAQ, OTHER]
    type:
      type: string
      enum: [stock, etf]
    stocks_owned:
      type: number
      format: double
      description: Current quantity held
    avg_cost_price:
      type: number
      format: double
      description: Average purchase price per share in the holding's currency
    realized_pnl:
      type: number
      format: double
      description: Profit/loss from shares already sold, in the holding's currency
    currency:
      type: string
      enum: [INR, EUR]
      default: INR
      description: Currency in which avg_cost_price and realized_pnl are denominated
    notes:
      type: string
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time

HoldingInput:
  type: object
  required: [script, exchange, type]
  properties:
    script:
      type: string
    symbol:
      type: string
    exchange:
      type: string
      enum: [NSE, BSE, NYSE, NASDAQ, OTHER]
    type:
      type: string
      enum: [stock, etf]
    stocks_owned:
      type: number
      format: double
      default: 0
    avg_cost_price:
      type: number
      format: double
      default: 0
    realized_pnl:
      type: number
      format: double
      default: 0
    currency:
      type: string
      enum: [INR, EUR]
      default: INR
      description: Currency in which avg_cost_price and realized_pnl are denominated
    notes:
      type: string

HoldingWithPrice:
  allOf:
    - $ref: "./schemas.yaml#/Holding"
    - type: object
      properties:
        current_price:
          type: number
          format: double
        cost_price:
          type: number
          format: double
          description: stocks_owned × avg_cost_price
        current_value:
          type: number
          format: double
          description: stocks_owned × current_price
        unrealized_pnl:
          type: number
          format: double
          description: current_value − cost_price
        cost_price_eur:
          type: number
          format: double
        current_value_eur:
          type: number
          format: double
        unrealized_pnl_eur:
          type: number
          format: double
        realized_pnl_eur:
          type: number
          format: double
        price_error:
          type: string

PricesResponse:
  type: object
  properties:
    holdings:
      type: array
      items:
        $ref: "./schemas.yaml#/HoldingWithPrice"
    eur_rate:
      type: number
      format: double
      description: Live INR→EUR rate used for conversions

Summary:
  type: object
  properties:
    total_cost:
      type: number
      format: double
    total_current_value:
      type: number
      format: double
    total_unrealized:
      type: number
      format: double
    total_realized:
      type: number
      format: double
    total_cost_eur:
      type: number
      format: double
    total_current_value_eur:
      type: number
      format: double
    total_unrealized_eur:
      type: number
      format: double
    total_realized_eur:
      type: number
      format: double
    eur_rate:
      type: number
      format: double

Error:
  type: object
  properties:
    error:
      type: string

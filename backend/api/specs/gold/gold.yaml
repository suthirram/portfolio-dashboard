---
# Gold tracking paths (PRD-003 / DD-003). Referenced from ../openapi.yaml.
# Every route below sits behind the AuthGate gold rule: callers without
# gold_enabled read 404 before any handler runs. 503 means Postgres (the
# gold store) is not configured — the rest of the app keeps serving.

transactions:
  get:
    tags: [Gold]
    summary: List the caller's gold purchases, newest first
    operationId: listGoldTransactions
    responses:
      "200":
        description: Purchases with computed columns (date desc)
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "../portfolio-api.yaml#/components/schemas/GoldTransaction"
      "401":
        $ref: "../portfolio-api.yaml#/components/responses/Unauthorized"
      "503":
        $ref: "../portfolio-api.yaml#/components/responses/GoldUnavailable"

  post:
    tags: [Gold]
    summary: Record a gold purchase
    operationId: createGoldTransaction
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../portfolio-api.yaml#/components/schemas/GoldTransactionInput"
    responses:
      "201":
        description: Stored purchase with computed columns
        content:
          application/json:
            schema:
              $ref: "../portfolio-api.yaml#/components/schemas/GoldTransaction"
      "400":
        $ref: "../portfolio-api.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../portfolio-api.yaml#/components/responses/Unauthorized"
      "503":
        $ref: "../portfolio-api.yaml#/components/responses/GoldUnavailable"

prices:
  get:
    tags: [Gold]
    summary: The caller's daily price series, ascending
    operationId: listGoldPrices
    parameters:
      - name: from
        in: query
        schema:
          type: string
          format: date
        description: Inclusive lower bound; open when omitted
      - name: to
        in: query
        schema:
          type: string
          format: date
        description: Inclusive upper bound; open when omitted
    responses:
      "200":
        description: Price rows in range, oldest first
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "../portfolio-api.yaml#/components/schemas/GoldPrice"
      "400":
        $ref: "../portfolio-api.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../portfolio-api.yaml#/components/responses/Unauthorized"
      "503":
        $ref: "../portfolio-api.yaml#/components/responses/GoldUnavailable"

  put:
    tags: [Gold]
    summary: Bulk upsert daily prices (the missing-day prompt saves all gaps in one call)
    operationId: putGoldPrices
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "../portfolio-api.yaml#/components/schemas/GoldPrice"
    responses:
      "204":
        description: Prices stored (existing days overwritten)
      "400":
        $ref: "../portfolio-api.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../portfolio-api.yaml#/components/responses/Unauthorized"
      "503":
        $ref: "../portfolio-api.yaml#/components/responses/GoldUnavailable"

missing_dates:
  get:
    tags: [Gold]
    summary: Calendar days since the first purchase that lack a price row
    operationId: listGoldMissingDates
    responses:
      "200":
        description: Gap list for the blocking prompt; empty when caught up
        content:
          application/json:
            schema:
              $ref: "../portfolio-api.yaml#/components/schemas/GoldMissingDates"
      "401":
        $ref: "../portfolio-api.yaml#/components/responses/Unauthorized"
      "503":
        $ref: "../portfolio-api.yaml#/components/responses/GoldUnavailable"

metrics:
  get:
    tags: [Gold]
    summary: The live gold metrics table incl. XIRR
    operationId: getGoldMetrics
    responses:
      "200":
        description: Metrics computed from the ledger + latest price + GOLDBEES
        content:
          application/json:
            schema:
              $ref: "../portfolio-api.yaml#/components/schemas/GoldMetrics"
      "401":
        $ref: "../portfolio-api.yaml#/components/responses/Unauthorized"
      "503":
        $ref: "../portfolio-api.yaml#/components/responses/GoldUnavailable"

transactions_id:
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
      description: Gold transaction id

  put:
    tags: [Gold]
    summary: Update a gold purchase
    operationId: updateGoldTransaction
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../portfolio-api.yaml#/components/schemas/GoldTransactionInput"
    responses:
      "200":
        description: Updated purchase with computed columns
        content:
          application/json:
            schema:
              $ref: "../portfolio-api.yaml#/components/schemas/GoldTransaction"
      "400":
        $ref: "../portfolio-api.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../portfolio-api.yaml#/components/responses/Unauthorized"
      "404":
        $ref: "../portfolio-api.yaml#/components/responses/NotFound"
      "503":
        $ref: "../portfolio-api.yaml#/components/responses/GoldUnavailable"

  delete:
    tags: [Gold]
    summary: Delete a gold purchase
    operationId: deleteGoldTransaction
    responses:
      "204":
        description: Deleted
      "401":
        $ref: "../portfolio-api.yaml#/components/responses/Unauthorized"
      "404":
        $ref: "../portfolio-api.yaml#/components/responses/NotFound"
      "503":
        $ref: "../portfolio-api.yaml#/components/responses/GoldUnavailable"

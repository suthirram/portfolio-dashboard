holdings:
  get:
    tags: [Holdings]
    summary: List all holdings
    operationId: listHoldings
    responses:
      "200":
        description: Array of holdings sorted by script name
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "../portfolio-api.yaml#/components/schemas/Holding"

  post:
    tags: [Holdings]
    summary: Add a new holding
    operationId: createHolding
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../portfolio-api.yaml#/components/schemas/HoldingInput"
    responses:
      "201":
        description: Created holding
        content:
          application/json:
            schema:
              $ref: "../portfolio-api.yaml#/components/schemas/Holding"
      "400":
        $ref: "../portfolio-api.yaml#/components/responses/BadRequest"

holdings_id:
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
      description: MongoDB ObjectID

  get:
    tags: [Holdings]
    summary: Get a single holding
    operationId: getHolding
    responses:
      "200":
        description: Holding found
        content:
          application/json:
            schema:
              $ref: "../portfolio-api.yaml#/components/schemas/Holding"
      "404":
        $ref: "../portfolio-api.yaml#/components/responses/NotFound"

  put:
    tags: [Holdings]
    summary: Update a holding
    operationId: updateHolding
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../portfolio-api.yaml#/components/schemas/HoldingInput"
    responses:
      "200":
        description: Updated holding
        content:
          application/json:
            schema:
              $ref: "../portfolio-api.yaml#/components/schemas/Holding"
      "404":
        $ref: "../portfolio-api.yaml#/components/responses/NotFound"

  delete:
    tags: [Holdings]
    summary: Delete a holding
    operationId: deleteHolding
    responses:
      "200":
        description: Deleted
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: deleted
      "404":
        $ref: "../portfolio-api.yaml#/components/responses/NotFound"

holdings_id_classification:
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
      description: MongoDB ObjectID

  put:
    tags: [Holdings]
    summary: Confirm or rename a holding's type and sector
    description: >
      Saves the owner's classification on this holding only (DD-013 §1–§2):
      source `user`, status `resolved`. Also sets the holding's type. Yahoo's
      text stays in provider_sector so a rename stays visible.
    operationId: confirmHoldingClassification
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../portfolio-api.yaml#/components/schemas/HoldingClassificationInput"
    responses:
      "200":
        description: Holding with its confirmed classification
        content:
          application/json:
            schema:
              $ref: "../portfolio-api.yaml#/components/schemas/Holding"
      "400":
        $ref: "../portfolio-api.yaml#/components/responses/BadRequest"
      "404":
        $ref: "../portfolio-api.yaml#/components/responses/NotFound"
      "409":
        description: The holding's symbol changed while confirming; reload and retry
        content:
          application/json:
            schema:
              $ref: "../portfolio-api.yaml#/components/schemas/Error"

prices:
  get:
    tags: [Holdings]
    summary: Get all holdings enriched with live market prices
    description: |
      Fetches current prices from Yahoo Finance for every holding that has a
      `symbol` set. Also returns the live INR→EUR exchange rate.
      Results are cached for 5 minutes to avoid rate-limiting.
    operationId: getPrices
    responses:
      "200":
        description: Holdings with live prices
        content:
          application/json:
            schema:
              $ref: "../portfolio-api.yaml#/components/schemas/PricesResponse"

summary:
  get:
    tags: [Holdings]
    summary: Portfolio-level summary with live P&L
    operationId: getSummary
    responses:
      "200":
        description: Aggregated portfolio metrics
        content:
          application/json:
            schema:
              $ref: "../portfolio-api.yaml#/components/schemas/Summary"

xirr:
  get:
    tags: [Holdings]
    summary: XIRR of the stock ledger, per currency and per holding
    operationId: getStockXirr
    responses:
      "200":
        description: Annualized money-weighted returns (PRD-012)
        content:
          application/json:
            schema:
              $ref: "../portfolio-api.yaml#/components/schemas/StockXirrView"

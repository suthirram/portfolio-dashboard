openapi: 3.0.3
info:
  title: Portfolio Dashboard API (model surface)
  description: |
    Models-only OpenAPI doc. Holds every component (schemas, responses,
    parameters, securitySchemes) for the Portfolio Dashboard API in one
    place. Consumed by `oapi-codegen-models.yaml` to emit `models.gen.go`.

    The path surface lives in `openapi.yaml` and the per-domain path files
    (`holdings.yaml`, `market.yaml`, `auth.yaml`, `admin.yaml`); they
    reference component types here via `./portfolio-api.yaml#/components/...`.
    `oapi-codegen-server.yaml` reads `openapi.yaml` and uses
    `--import-mapping` to resolve those refs to the types declared in this
    file (same Go package), so `server.gen.go` does not re-emit them.
  version: 1.0.0

paths: {}

components:
  parameters:
    UserID:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: MongoDB ObjectID of the target user

  schemas:
    Region:
      type: object
      required: [id, label]
      properties:
        id:
          type: string
          description: Stable region key (india, europe, us)
        label:
          type: string
          description: Display name

    SecurityQuestion:
      type: object
      required: [id, prompt]
      properties:
        id:
          type: string
          description: Stable question key from the fixed catalogue
        prompt:
          type: string

    SecurityAnswerInput:
      type: object
      required: [question_id, answer]
      properties:
        question_id:
          type: string
          description: Question key from the catalogue
        answer:
          type: string
          description: Answer text; compared case-insensitively, surrounding whitespace ignored

    User:
      type: object
      required: [id, username, name, role, region, disabled, locked, must_change_password]
      properties:
        id:
          type: string
          description: MongoDB ObjectID
        username:
          type: string
          description: Username as originally typed (uniqueness is case-insensitive)
        name:
          type: string
        role:
          type: string
          enum: [user, admin, superadmin]
        region:
          type: string
          description: Oversight region (india, europe, us); empty for the super admin
        disabled:
          type: boolean
          description: Hidden (reversibly blocked) by an admin
        locked:
          type: boolean
          description: Security-question recovery locked after three wrong attempts
        must_change_password:
          type: boolean
          description: Forced onboarding pending (bootstrap super admin)
        security_question_ids:
          type: array
          items:
            type: string
          description: The catalogue keys of the account's chosen questions (own account only)
        created_at:
          type: string
          format: date-time
        last_login_at:
          type: string
          format: date-time

    SignupRequest:
      type: object
      required: [username, name, password, region, security_answers]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 32
          description: "Allowed characters: A–Z a–z 0–9 _ -"
        name:
          type: string
          minLength: 1
          maxLength: 80
        password:
          type: string
          minLength: 8
        region:
          type: string
          description: One of the /regions catalogue ids
        security_answers:
          type: array
          minItems: 3
          maxItems: 3
          items:
            $ref: "#/components/schemas/SecurityAnswerInput"

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    RecoverQuestionsRequest:
      type: object
      required: [username]
      properties:
        username:
          type: string

    RecoverRequest:
      type: object
      required: [username, answers, new_password]
      properties:
        username:
          type: string
        answers:
          type: array
          minItems: 3
          maxItems: 3
          items:
            $ref: "#/components/schemas/SecurityAnswerInput"
        new_password:
          type: string
          minLength: 8

    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
        new_password:
          type: string
          minLength: 8

    UpdateProfileRequest:
      type: object
      required: [current_password]
      properties:
        current_password:
          type: string
        name:
          type: string
          minLength: 1
          maxLength: 80
        username:
          type: string
          minLength: 3
          maxLength: 32

    UpdateSecurityQuestionsRequest:
      type: object
      required: [current_password, security_answers]
      properties:
        current_password:
          type: string
        security_answers:
          type: array
          minItems: 3
          maxItems: 3
          items:
            $ref: "#/components/schemas/SecurityAnswerInput"

    OnboardingRequest:
      type: object
      required: [current_password, new_password, security_answers]
      properties:
        current_password:
          type: string
        new_password:
          type: string
          minLength: 8
        security_answers:
          type: array
          minItems: 3
          maxItems: 3
          items:
            $ref: "#/components/schemas/SecurityAnswerInput"

    RegionUpdateRequest:
      type: object
      required: [region]
      properties:
        region:
          type: string
          description: One of the /regions catalogue ids

    Holding:
      type: object
      properties:
        id:
          type: string
          description: MongoDB ObjectID
        script:
          type: string
          description: Display name (e.g. "TCS", "GOLD BEES")
        symbol:
          type: string
          description: Yahoo Finance ticker (e.g. "TCS.NS", "GOLDBEES.NS", "AAPL")
        exchange:
          type: string
          enum: [NSE, BSE, NYSE, NASDAQ, OTHER]
        type:
          type: string
          enum: [stock, etf]
        stocks_owned:
          type: number
          format: double
          description: Current quantity held
        avg_cost_price:
          type: number
          format: double
          description: Average purchase price per share in the holding's currency
        realized_pnl:
          type: number
          format: double
          description: Profit/loss from shares already sold, in the holding's currency (derived, average cost)
        total_dividends:
          type: number
          format: double
          description: Cumulative cash dividend income, in the holding's currency (derived)
        currency:
          type: string
          enum: [INR, EUR]
          default: INR
          description: Currency in which avg_cost_price and realized_pnl are denominated
        notes:
          type: string
        has_opening:
          type: boolean
          description: Whether an opening-balance event seeds this holding (drives the opening-date prompt)
        opening_date:
          type: string
          format: date
          nullable: true
          description: User-set effective date of the opening balance; null when not yet set
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    HoldingInput:
      type: object
      required: [script, exchange, type]
      properties:
        script:
          type: string
        symbol:
          type: string
        exchange:
          type: string
          enum: [NSE, BSE, NYSE, NASDAQ, OTHER]
        type:
          type: string
          enum: [stock, etf]
        stocks_owned:
          type: number
          format: double
          default: 0
        avg_cost_price:
          type: number
          format: double
          default: 0
        realized_pnl:
          type: number
          format: double
          default: 0
          description: Opening realized P&L seed (legacy carry); new sells derive this from the ledger
        currency:
          type: string
          enum: [INR, EUR]
          default: INR
          description: Currency in which avg_cost_price and realized_pnl are denominated
        notes:
          type: string
        opening_date:
          type: string
          format: date
          nullable: true
          description: Effective date of the opening balance; sets the holding's opening event date when provided

    HoldingWithPrice:
      allOf:
        - $ref: "#/components/schemas/Holding"
        - type: object
          properties:
            current_price:
              type: number
              format: double
            cost_price:
              type: number
              format: double
              description: stocks_owned × avg_cost_price
            current_value:
              type: number
              format: double
              description: stocks_owned × current_price
            unrealized_pnl:
              type: number
              format: double
              description: current_value − cost_price
            cost_price_eur:
              type: number
              format: double
            current_value_eur:
              type: number
              format: double
            unrealized_pnl_eur:
              type: number
              format: double
            realized_pnl_eur:
              type: number
              format: double
            price_error:
              type: string

    Transaction:
      type: object
      properties:
        id:
          type: string
          description: MongoDB ObjectID
        holding_id:
          type: string
          description: Owning holding's ObjectID
        type:
          type: string
          enum: [opening, buy, sell, dividend, split, bonus, merger]
        date:
          type: string
          format: date-time
          description: Trade / ex date; orders the ledger
        quantity:
          type: number
          format: double
          description: Shares (buy/sell/opening); unused for dividend
        amount:
          type: number
          format: double
          description: Total cash — debited (buy) or credited (sell, dividend); fees folded in
        ratio:
          type: number
          format: double
          description: Split/bonus ratio, e.g. 2.0 = 2-for-1
        realized_seed:
          type: number
          format: double
          description: Opening only — carries a legacy realized P&L with no underlying sell
        currency:
          type: string
          enum: [INR, EUR]
        notes:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    TransactionInput:
      type: object
      required: [type, date]
      properties:
        type:
          type: string
          enum: [opening, buy, sell, dividend, split, bonus, merger]
        date:
          type: string
          format: date-time
        quantity:
          type: number
          format: double
          default: 0
        amount:
          type: number
          format: double
          default: 0
        ratio:
          type: number
          format: double
        realized_seed:
          type: number
          format: double
        notes:
          type: string

    PricesResponse:
      type: object
      properties:
        holdings:
          type: array
          items:
            $ref: "#/components/schemas/HoldingWithPrice"
        eur_rate:
          type: number
          format: double
          description: Live INR→EUR rate used for conversions

    Summary:
      type: object
      properties:
        total_cost:
          type: number
          format: double
        total_current_value:
          type: number
          format: double
        total_unrealized:
          type: number
          format: double
        total_realized:
          type: number
          format: double
        total_cost_eur:
          type: number
          format: double
        total_current_value_eur:
          type: number
          format: double
        total_unrealized_eur:
          type: number
          format: double
        total_realized_eur:
          type: number
          format: double
        eur_rate:
          type: number
          format: double
        previous_close_value:
          type: number
          format: double
          description: >-
            Portfolio current value (INR base) at the most recent snapshot
            strictly before today — the previous close. Omitted when the
            user has no prior snapshot.
        previous_close_value_eur:
          type: number
          format: double
        previous_close_date:
          type: string
          description: YYYY-MM-DD of the snapshot used as the previous close.
        change_value:
          type: number
          format: double
          description: total_current_value − previous_close_value (INR base).
        change_value_eur:
          type: number
          format: double
        change_pct:
          type: number
          format: double
          nullable: true
          description: >-
            Percent change vs previous close. Null when previous_close_value
            is zero.
        per_currency:
          type: array
          description: >-
            Per-currency change vs previous close, in native amounts (no FX
            conversion), so currency moves don't muddy the price move.
          items:
            $ref: '#/components/schemas/CurrencyChange'

    CurrencyChange:
      type: object
      properties:
        currency:
          type: string
          description: INR | EUR | USD
        current:
          type: number
          format: double
          description: Today's live current value in the native currency.
        previous_close:
          type: number
          format: double
          description: Snapshot current value in the native currency.
        change_value:
          type: number
          format: double
        change_pct:
          type: number
          format: double
          nullable: true

    Error:
      type: object
      properties:
        error:
          type: string

    # ---- /api/history ----

    HistoryRegionSnapshot:
      type: object
      required: [invested, current, source]
      properties:
        invested:
          type: number
          format: double
        current:
          type: number
          format: double
        source:
          type: string
          enum: [cron, manual]
        original_cron_invested:
          type: number
          format: double
          nullable: true
          description: Pre-override cron value (audit anchor; PD-042 §3.3).
        original_cron_current:
          type: number
          format: double
          nullable: true
        write_currency:
          type: string
          description: Currency code (INR|EUR|USD) the manual amount was typed in. Empty on cron-written buckets.

    HistoryTotals:
      type: object
      required: [invested_total, current_total]
      properties:
        invested_total:
          type: number
          format: double
        current_total:
          type: number
          format: double
        pnl_pct:
          type: number
          format: double
          nullable: true
          description: Null when invested_total is zero (divide-by-zero).

    HistoryHolding:
      type: object
      required: [symbol, script, close_price]
      description: One stock's line within a history snapshot (cron rows only).
      properties:
        symbol:
          type: string
        script:
          type: string
        currency:
          type: string
          description: Bucket currency code (INR|EUR|USD)
        quantity:
          type: number
          format: double
        close_price:
          type: number
          format: double
          description: Close price on price_date (the row's current price)
        price_date:
          type: string
          description: Trading date the close_price belongs to (YYYY-MM-DD)
        current:
          type: number
          format: double
          description: quantity × close_price

    HistoryRow:
      type: object
      required: [date, regions, totals]
      properties:
        date:
          type: string
          format: date
        regions:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/HistoryRegionSnapshot"
        totals:
          $ref: "#/components/schemas/HistoryTotals"
        holdings:
          type: array
          description: Per-stock breakdown for cron-sourced rows; absent on manual-only rows.
          items:
            $ref: "#/components/schemas/HistoryHolding"

    HistoryList:
      type: object
      required: [currency, rows]
      properties:
        currency:
          type: string
        rows:
          type: array
          items:
            $ref: "#/components/schemas/HistoryRow"

    HistoryRegionInput:
      type: object
      required: [invested, current]
      properties:
        invested:
          type: number
          format: double
        current:
          type: number
          format: double

    AddHistoryRowInput:
      type: object
      required: [date, regions]
      properties:
        date:
          type: string
          format: date
        regions:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/HistoryRegionInput"

    PatchHistoryRegionsInput:
      type: object
      required: [regions]
      properties:
        regions:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/HistoryRegionInput"

    PasteHistoryInput:
      type: object
      required: [month, rows]
      properties:
        month:
          type: string
          description: YYYY-MM
        rows:
          type: array
          items:
            $ref: "#/components/schemas/AddHistoryRowInput"

    HistoryDateConflict:
      type: object
      required: [date, existing, incoming]
      properties:
        date:
          type: string
          format: date
        existing:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/HistoryRegionSnapshot"
        incoming:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/HistoryRegionInput"

    RejectedPasteRow:
      type: object
      required: [date, reason]
      properties:
        date:
          type: string
        reason:
          type: string

    PasteHistoryReport:
      type: object
      required: [applied, conflicts, rejected]
      properties:
        applied:
          type: array
          items:
            type: string
            format: date
        conflicts:
          type: array
          items:
            $ref: "#/components/schemas/HistoryDateConflict"
        rejected:
          type: array
          items:
            $ref: "#/components/schemas/RejectedPasteRow"

    HistoryConflictResponse:
      type: object
      required: [error, conflicts]
      properties:
        error:
          type: string
        conflicts:
          type: array
          items:
            type: object
            required: [region, existing, incoming]
            properties:
              region:
                type: string
              existing:
                $ref: "#/components/schemas/HistoryRegionSnapshot"
              incoming:
                $ref: "#/components/schemas/HistoryRegionInput"

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Not logged in, or credentials/answers rejected
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Logged in but not allowed (role, scope, or hidden account)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Username already taken
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Locked:
      description: Recovery locked after three wrong security-answer attempts
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadGateway:
      description: Upstream (Yahoo Finance) error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

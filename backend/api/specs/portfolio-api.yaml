openapi: 3.0.3
info:
  title: Portfolio Dashboard API (model surface)
  description: |
    Models-only OpenAPI doc. Holds every component (schemas, responses,
    parameters, securitySchemes) for the Portfolio Dashboard API in one
    place. Consumed by `oapi-codegen-models.yaml` to emit `models.gen.go`.

    The path surface lives in `openapi.yaml` and the per-domain path files
    (`holdings.yaml`, `market.yaml`, `auth.yaml`, `admin.yaml`); they
    reference component types here via `./portfolio-api.yaml#/components/...`.
    `oapi-codegen-server.yaml` reads `openapi.yaml` and uses
    `--import-mapping` to resolve those refs to the types declared in this
    file (same Go package), so `server.gen.go` does not re-emit them.
  version: 1.0.0

paths: {}

components:
  parameters:
    UserID:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: MongoDB ObjectID of the target user

  schemas:
    Region:
      type: object
      required: [id, label]
      properties:
        id:
          type: string
          description: Stable region key (india, europe, us)
        label:
          type: string
          description: Display name

    SecurityQuestion:
      type: object
      required: [id, prompt]
      properties:
        id:
          type: string
          description: Stable question key from the fixed catalogue
        prompt:
          type: string

    SecurityAnswerInput:
      type: object
      required: [question_id, answer]
      properties:
        question_id:
          type: string
          description: Question key from the catalogue
        answer:
          type: string
          description: Answer text; compared case-insensitively, surrounding whitespace ignored

    User:
      type: object
      required: [id, username, name, role, region, disabled, locked, gold_enabled, premium, must_change_password]
      properties:
        id:
          type: string
          description: MongoDB ObjectID
        username:
          type: string
          description: Username as originally typed (uniqueness is case-insensitive)
        name:
          type: string
        role:
          type: string
          enum: [user, admin, superadmin]
        region:
          type: string
          description: Oversight region (india, europe, us); empty for the super admin
        disabled:
          type: boolean
          description: Hidden (reversibly blocked) by an admin
        locked:
          type: boolean
          description: Security-question recovery locked after three wrong attempts
        gold_enabled:
          type: boolean
          description: Physical-gold tracking enabled (super-admin toggled, PRD-003 §2.4)
        premium:
          type: boolean
          description: Premium features enabled (super-admin toggled, PD-046 — cyberpunk theme)
        must_change_password:
          type: boolean
          description: Forced onboarding pending (bootstrap super admin)
        security_question_ids:
          type: array
          items:
            type: string
          description: The catalogue keys of the account's chosen questions (own account only)
        created_at:
          type: string
          format: date-time
        last_login_at:
          type: string
          format: date-time

    SignupRequest:
      type: object
      required: [username, name, password, region, security_answers]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 32
          description: "Allowed characters: A–Z a–z 0–9 _ -"
        name:
          type: string
          minLength: 1
          maxLength: 80
        password:
          type: string
          minLength: 8
        region:
          type: string
          description: One of the /regions catalogue ids
        security_answers:
          type: array
          minItems: 3
          maxItems: 3
          items:
            $ref: "#/components/schemas/SecurityAnswerInput"

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    RecoverQuestionsRequest:
      type: object
      required: [username]
      properties:
        username:
          type: string

    RecoverRequest:
      type: object
      required: [username, answers, new_password]
      properties:
        username:
          type: string
        answers:
          type: array
          minItems: 3
          maxItems: 3
          items:
            $ref: "#/components/schemas/SecurityAnswerInput"
        new_password:
          type: string
          minLength: 8

    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
        new_password:
          type: string
          minLength: 8

    UpdateProfileRequest:
      type: object
      required: [current_password]
      properties:
        current_password:
          type: string
        name:
          type: string
          minLength: 1
          maxLength: 80
        username:
          type: string
          minLength: 3
          maxLength: 32

    UpdateSecurityQuestionsRequest:
      type: object
      required: [current_password, security_answers]
      properties:
        current_password:
          type: string
        security_answers:
          type: array
          minItems: 3
          maxItems: 3
          items:
            $ref: "#/components/schemas/SecurityAnswerInput"

    OnboardingRequest:
      type: object
      required: [current_password, new_password, security_answers]
      properties:
        current_password:
          type: string
        new_password:
          type: string
          minLength: 8
        security_answers:
          type: array
          minItems: 3
          maxItems: 3
          items:
            $ref: "#/components/schemas/SecurityAnswerInput"

    RegionUpdateRequest:
      type: object
      required: [region]
      properties:
        region:
          type: string
          description: One of the /regions catalogue ids

    GoldToggleRequest:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
          description: Turn gold tracking on or off for the account

    PremiumToggleRequest:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
          description: Turn premium features on or off for the account

    BrandingFont:
      type: string
      enum: [roboto, jetbrains_mono]
      description: Deployment-wide app font choice.

    BrandingFontOption:
      type: object
      required: [id, label, css_family]
      properties:
        id:
          $ref: "#/components/schemas/BrandingFont"
        label:
          type: string
          description: Human-readable font name.
        css_family:
          type: string
          description: CSS font-family stack for applying the font.

    BrandingSettings:
      type: object
      required: [font, allowed_fonts]
      properties:
        font:
          $ref: "#/components/schemas/BrandingFont"
        allowed_fonts:
          type: array
          description: Fonts the super admin may choose from.
          items:
            $ref: "#/components/schemas/BrandingFontOption"

    BrandingUpdateRequest:
      type: object
      required: [font]
      properties:
        font:
          $ref: "#/components/schemas/BrandingFont"

    GoldPrice:
      type: object
      description: One user-entered daily per-gram gold price (PRD-003 §7).
      required: [date, price_per_gram]
      properties:
        date:
          type: string
          format: date
        price_per_gram:
          type: number
          format: double
          description: Per-gram rate for that calendar day (> 0)

    GoldMissingDates:
      type: object
      description: |
        Calendar days between the first gold purchase and today that have
        no price row — the Gold page's blocking prompt (PRD-003 §7).
      required: [missing]
      properties:
        missing:
          type: array
          items:
            type: string
            format: date

    GoldMetrics:
      type: object
      description: |
        The live metrics table (PRD-003 §6) — computed from the ledger,
        the latest price on/before today, and the GOLDBEES holdings.
        Nullable fields are unknowable in the current state (no price row
        yet, empty ledger, or the live GOLDBEES quote unavailable).
      required: [invested, grams]
      properties:
        invested:
          type: number
          format: double
          description: Σ actual_paid over all purchases
        grams:
          type: number
          format: double
          description: Σ grams_bought (actual weight, PRD §9.4)
        latest_price:
          type: number
          format: double
          nullable: true
          description: Most recent daily price on/before today — the valuation rate
        current:
          type: number
          format: double
          nullable: true
          description: grams × latest_price
        bees_pl:
          type: number
          format: double
          nullable: true
          description: GOLDBEES realised + unrealised P&L, no tax adjustment (PRD §9.6/§9.7)
        nett_ex_bees:
          type: number
          format: double
          nullable: true
          description: current − invested
        nett_in_bees:
          type: number
          format: double
          nullable: true
          description: nett_ex_bees + bees_pl
        avg_per_gram:
          type: number
          format: double
          nullable: true
          description: invested ÷ grams
        xirr:
          type: number
          format: double
          nullable: true
          description: Annualized rate as a fraction (0.12 = 12%); null when non-convergent

    GoldHistoryOverlay:
      type: object
      description: |
        Physical-gold position as of a history row's date (PRD-003 §8) —
        present only for gold-enabled users, only on dates on/after their
        first purchase with a valuation price available. Computed on read
        from the gold ledger + price series; never snapshotted. GOLDBEES
        is excluded (already in the stock buckets).
      required: [invested, current, volatility_pct]
      properties:
        invested:
          type: number
          format: double
          description: Σ actual_paid of purchases dated on/before the row date
        current:
          type: number
          format: double
          description: grams held on/before the row date × that date's price (nearest earlier fallback)
        volatility_pct:
          type: number
          format: double
          description: "% change of current vs the previous row in the response window (0 on the first)"
        pnl_pct:
          type: number
          format: double
          nullable: true
          description: (current − invested) ÷ invested × 100; null when nothing invested

    GoldTransactionInput:
      type: object
      description: |
        Entered fields of one physical gold purchase (PRD-003 §5). Every
        computed column is derived server-side; clients never send them.
      required: [date, gm_price, grams_bought, actual_paid]
      properties:
        date:
          type: string
          format: date
          description: Purchase date
        gm_price:
          type: number
          format: double
          description: Per-gram rate for this purchase (> 0)
        grams_bought:
          type: number
          format: double
          description: Grams actually bought (> 0)
        quote_price:
          type: number
          format: double
          nullable: true
          description: Per-gram rate the jeweler quoted
        bill_amount:
          type: number
          format: double
          nullable: true
          description: Amount printed on the bill
        actual_paid:
          type: number
          format: double
          description: Cash actually paid (>= 0)
        billed_weight:
          type: number
          format: double
          nullable: true
          description: Grams on the bill (can differ from actual)
        chennai_rate:
          type: string
          nullable: true
          description: Free-text remark (a rate, "Ditto", a note); not validated

    GoldTransaction:
      type: object
      description: One gold purchase with the derived columns (PRD-003 §5).
      required:
        [id, date, gm_price, grams_bought, actual_paid, gold_cost,
         gst_on_cost, total_expected, nett_per_gram, nimmi_loss]
      properties:
        id:
          type: integer
          format: int64
        date:
          type: string
          format: date
        gm_price:
          type: number
          format: double
        grams_bought:
          type: number
          format: double
        quote_price:
          type: number
          format: double
          nullable: true
        bill_amount:
          type: number
          format: double
          nullable: true
        actual_paid:
          type: number
          format: double
        billed_weight:
          type: number
          format: double
          nullable: true
        chennai_rate:
          type: string
          nullable: true
        gold_cost:
          type: number
          format: double
          description: gm_price × grams_bought
        gst_on_cost:
          type: number
          format: double
          description: 3% of gold_cost
        total_expected:
          type: number
          format: double
          description: gold_cost + gst_on_cost
        gst_on_quote:
          type: number
          format: double
          nullable: true
          description: 3% of quote_price; null when no quote recorded
        nett_per_gram:
          type: number
          format: double
          description: actual_paid ÷ grams_bought
        nett_reduction:
          type: number
          format: double
          nullable: true
          description: bill_amount − actual_paid; null when no bill recorded
        nimmi_loss:
          type: number
          format: double
          description: actual_paid − gold_cost (spreadsheet J − D)

    Holding:
      type: object
      properties:
        id:
          type: string
          description: MongoDB ObjectID
        script:
          type: string
          description: Display name (e.g. "TCS", "GOLD BEES")
        symbol:
          type: string
          description: Yahoo Finance ticker (e.g. "TCS.NS", "GOLDBEES.NS", "AAPL")
        exchange:
          type: string
          enum: [NSE, BSE, NYSE, NASDAQ, OTHER]
        type:
          type: string
          enum: [stock, etf]
        stocks_owned:
          type: number
          format: double
          description: Current quantity held
        avg_cost_price:
          type: number
          format: double
          description: Average purchase price per share in the holding's currency
        realized_pnl:
          type: number
          format: double
          description: Profit/loss from shares already sold, in the holding's currency (derived, average cost)
        total_dividends:
          type: number
          format: double
          description: Cumulative cash dividend income, in the holding's currency (derived)
        currency:
          type: string
          enum: [INR, EUR]
          default: INR
          description: Currency in which avg_cost_price and realized_pnl are denominated
        notes:
          type: string
        has_opening:
          type: boolean
          description: Whether an opening-balance event seeds this holding (drives the opening-date prompt)
        opening_date:
          type: string
          format: date
          nullable: true
          description: User-set effective date of the opening balance; null when not yet set
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    HoldingInput:
      type: object
      required: [script, exchange, type]
      properties:
        script:
          type: string
        symbol:
          type: string
        exchange:
          type: string
          enum: [NSE, BSE, NYSE, NASDAQ, OTHER]
        type:
          type: string
          enum: [stock, etf]
        stocks_owned:
          type: number
          format: double
          default: 0
        avg_cost_price:
          type: number
          format: double
          default: 0
        realized_pnl:
          type: number
          format: double
          default: 0
          description: Opening realized P&L seed (legacy carry); new sells derive this from the ledger
        currency:
          type: string
          enum: [INR, EUR]
          default: INR
          description: Currency in which avg_cost_price and realized_pnl are denominated
        notes:
          type: string
        opening_date:
          type: string
          format: date
          nullable: true
          description: Effective date of the opening balance; sets the holding's opening event date when provided

    HoldingWithPrice:
      allOf:
        - $ref: "#/components/schemas/Holding"
        - type: object
          properties:
            current_price:
              type: number
              format: double
            cost_price:
              type: number
              format: double
              description: stocks_owned × avg_cost_price
            current_value:
              type: number
              format: double
              description: stocks_owned × current_price
            unrealized_pnl:
              type: number
              format: double
              description: current_value − cost_price
            cost_price_eur:
              type: number
              format: double
            current_value_eur:
              type: number
              format: double
            unrealized_pnl_eur:
              type: number
              format: double
            realized_pnl_eur:
              type: number
              format: double
            price_error:
              type: string

    Transaction:
      type: object
      properties:
        id:
          type: string
          description: MongoDB ObjectID
        holding_id:
          type: string
          description: Owning holding's ObjectID
        type:
          type: string
          enum: [opening, buy, sell, dividend, split, bonus, merger]
        date:
          type: string
          format: date-time
          description: Trade / ex date; orders the ledger
        quantity:
          type: number
          format: double
          description: Shares (buy/sell/opening); unused for dividend
        amount:
          type: number
          format: double
          description: Total cash — debited (buy) or credited (sell, dividend); fees folded in
        ratio:
          type: number
          format: double
          description: Split/bonus ratio, e.g. 2.0 = 2-for-1
        realized_seed:
          type: number
          format: double
          description: Opening only — carries a legacy realized P&L with no underlying sell
        currency:
          type: string
          enum: [INR, EUR]
        notes:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    TransactionInput:
      type: object
      required: [type, date]
      properties:
        type:
          type: string
          enum: [opening, buy, sell, dividend, split, bonus, merger]
        date:
          type: string
          format: date-time
        quantity:
          type: number
          format: double
          default: 0
        amount:
          type: number
          format: double
          default: 0
        ratio:
          type: number
          format: double
        realized_seed:
          type: number
          format: double
        notes:
          type: string

    PricesResponse:
      type: object
      properties:
        holdings:
          type: array
          items:
            $ref: "#/components/schemas/HoldingWithPrice"
        eur_rate:
          type: number
          format: double
          description: Live INR→EUR rate used for conversions

    Summary:
      type: object
      properties:
        total_cost:
          type: number
          format: double
        total_current_value:
          type: number
          format: double
        total_unrealized:
          type: number
          format: double
        total_realized:
          type: number
          format: double
        total_cost_eur:
          type: number
          format: double
        total_current_value_eur:
          type: number
          format: double
        total_unrealized_eur:
          type: number
          format: double
        total_realized_eur:
          type: number
          format: double
        eur_rate:
          type: number
          format: double
        previous_close_value:
          type: number
          format: double
          description: >-
            Portfolio current value (INR base) at the most recent snapshot
            strictly before today — the previous close. Omitted when the
            user has no prior snapshot.
        previous_close_value_eur:
          type: number
          format: double
        previous_close_date:
          type: string
          description: YYYY-MM-DD of the snapshot used as the previous close.
        change_value:
          type: number
          format: double
          description: total_current_value − previous_close_value (INR base).
        change_value_eur:
          type: number
          format: double
        change_pct:
          type: number
          format: double
          nullable: true
          description: >-
            Percent change vs previous close. Null when previous_close_value
            is zero.
        per_currency:
          type: array
          description: >-
            Per-currency change vs previous close, in native amounts (no FX
            conversion), so currency moves don't muddy the price move.
          items:
            $ref: '#/components/schemas/CurrencyChange'

    CurrencyChange:
      type: object
      properties:
        currency:
          type: string
          description: INR | EUR | USD
        current:
          type: number
          format: double
          description: Today's live current value in the native currency.
        previous_close:
          type: number
          format: double
          description: Snapshot current value in the native currency.
        change_value:
          type: number
          format: double
        change_pct:
          type: number
          format: double
          nullable: true

    Error:
      type: object
      properties:
        error:
          type: string

    # ---- /api/history ----

    HistoryRegionSnapshot:
      type: object
      required: [invested, current, source]
      properties:
        invested:
          type: number
          format: double
        current:
          type: number
          format: double
        source:
          type: string
          enum: [cron, manual]
        original_cron_invested:
          type: number
          format: double
          nullable: true
          description: Pre-override cron value (audit anchor; PD-042 §3.3).
        original_cron_current:
          type: number
          format: double
          nullable: true
        write_currency:
          type: string
          description: Currency code (INR|EUR|USD) the manual amount was typed in. Empty on cron-written buckets.

    HistoryTotals:
      type: object
      required: [invested_total, current_total]
      properties:
        invested_total:
          type: number
          format: double
        current_total:
          type: number
          format: double
        pnl_pct:
          type: number
          format: double
          nullable: true
          description: Null when invested_total is zero (divide-by-zero).

    HistoryHolding:
      type: object
      required: [symbol, script, currency, quantity, close_price]
      description: One stock's line within a history snapshot (cron rows only).
      properties:
        symbol:
          type: string
        script:
          type: string
        currency:
          type: string
          description: Bucket currency code (INR|EUR|USD)
        quantity:
          type: number
          format: double
        close_price:
          type: number
          format: double
          description: Close price on price_date (the row's current price)
        price_date:
          type: string
          description: Trading date the close_price belongs to (YYYY-MM-DD)
        current:
          type: number
          format: double
          description: quantity × close_price

    HistoryRow:
      type: object
      required: [date, regions, totals]
      properties:
        date:
          type: string
          format: date
        regions:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/HistoryRegionSnapshot"
        totals:
          $ref: "#/components/schemas/HistoryTotals"
        holdings:
          type: array
          description: Per-stock breakdown for cron-sourced rows; absent on manual-only rows.
          items:
            $ref: "#/components/schemas/HistoryHolding"
        gold:
          $ref: "#/components/schemas/GoldHistoryOverlay"

    HistoryList:
      type: object
      required: [currency, rows]
      properties:
        currency:
          type: string
        rows:
          type: array
          items:
            $ref: "#/components/schemas/HistoryRow"

    HistoryRegionInput:
      type: object
      required: [invested, current]
      properties:
        invested:
          type: number
          format: double
        current:
          type: number
          format: double

    AddHistoryRowInput:
      type: object
      required: [date, regions]
      properties:
        date:
          type: string
          format: date
        regions:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/HistoryRegionInput"

    PatchHistoryRegionsInput:
      type: object
      required: [regions]
      properties:
        regions:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/HistoryRegionInput"

    PasteHistoryInput:
      type: object
      required: [month, rows]
      properties:
        month:
          type: string
          description: YYYY-MM
        rows:
          type: array
          items:
            $ref: "#/components/schemas/AddHistoryRowInput"

    HistoryDateConflict:
      type: object
      required: [date, existing, incoming]
      properties:
        date:
          type: string
          format: date
        existing:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/HistoryRegionSnapshot"
        incoming:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/HistoryRegionInput"

    RejectedPasteRow:
      type: object
      required: [date, reason]
      properties:
        date:
          type: string
        reason:
          type: string

    PasteHistoryReport:
      type: object
      required: [applied, conflicts, rejected]
      properties:
        applied:
          type: array
          items:
            type: string
            format: date
        conflicts:
          type: array
          items:
            $ref: "#/components/schemas/HistoryDateConflict"
        rejected:
          type: array
          items:
            $ref: "#/components/schemas/RejectedPasteRow"

    HistoryConflictResponse:
      type: object
      required: [error, conflicts]
      properties:
        error:
          type: string
        conflicts:
          type: array
          items:
            type: object
            required: [region, existing, incoming]
            properties:
              region:
                type: string
              existing:
                $ref: "#/components/schemas/HistoryRegionSnapshot"
              incoming:
                $ref: "#/components/schemas/HistoryRegionInput"

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Not logged in, or credentials/answers rejected
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Logged in but not allowed (role, scope, or hidden account)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Username already taken
      content:
        application/json:
          schema:

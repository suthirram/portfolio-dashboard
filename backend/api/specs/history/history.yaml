history:
  get:
    tags: [History]
    summary: List historical snapshots in a date range
    operationId: listHistory
    parameters:
      - name: from
        in: query
        required: true
        schema:
          type: string
          format: date
      - name: to
        in: query
        required: true
        schema:
          type: string
          format: date
      - name: include_previous
        in: query
        required: false
        schema:
          type: boolean
          default: false
        description: |
          Also return the latest row dated before `from`, however far back
          (PRD-006 §4): the opening baseline for a month and the prior row for
          the month's first Daily volatlity. Omitted when no earlier row exists.
    responses:
      "200":
        description: Snapshots ordered newest-first
        content:
          application/json:
            schema:
              $ref: "../portfolio-api.yaml#/components/schemas/HistoryList"
      "400":
        $ref: "../portfolio-api.yaml#/components/responses/BadRequest"

  post:
    tags: [History]
    summary: Add a manual snapshot row
    operationId: addHistoryRow
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../portfolio-api.yaml#/components/schemas/AddHistoryRowInput"
    responses:
      "201":
        description: Created row
        content:
          application/json:
            schema:
              $ref: "../portfolio-api.yaml#/components/schemas/HistoryRow"
      "400":
        $ref: "../portfolio-api.yaml#/components/responses/BadRequest"
      "409":
        description: A row already exists for this date — caller must resolve regions via PUT /history/{date}/regions
        content:
          application/json:
            schema:
              $ref: "../portfolio-api.yaml#/components/schemas/HistoryConflictResponse"

history_date_regions:
  parameters:
    - name: date
      in: path
      required: true
      schema:
        type: string
        format: date
      description: UTC date the patch targets

  put:
    tags: [History]
    summary: Override one or more regions on an existing row
    operationId: patchHistoryRegions
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../portfolio-api.yaml#/components/schemas/PatchHistoryRegionsInput"
    responses:
      "200":
        description: Updated row
        content:
          application/json:
            schema:
              $ref: "../portfolio-api.yaml#/components/schemas/HistoryRow"
      "400":
        $ref: "../portfolio-api.yaml#/components/responses/BadRequest"
      "404":
        $ref: "../portfolio-api.yaml#/components/responses/NotFound"

history_date:
  parameters:
    - name: date
      in: path
      required: true
      schema:
        type: string
        format: date

  delete:
    tags: [History]
    summary: Delete a manual snapshot row
    operationId: deleteHistoryRow
    responses:
      "204":
        description: Deleted
      "400":
        $ref: "../portfolio-api.yaml#/components/responses/BadRequest"
      "404":
        $ref: "../portfolio-api.yaml#/components/responses/NotFound"
      "409":
        description: Row contains a cron-written bucket; override individual regions instead
        content:
          application/json:
            schema:
              $ref: "../portfolio-api.yaml#/components/schemas/Error"

history_paste:
  post:
    tags: [History]
    summary: Bulk-paste a month of manual rows
    operationId: pasteHistory
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../portfolio-api.yaml#/components/schemas/PasteHistoryInput"
    responses:
      "200":
        description: Three-bucket report — applied / conflicts / rejected
        content:
          application/json:
            schema:
              $ref: "../portfolio-api.yaml#/components/schemas/PasteHistoryReport"
      "400":
        $ref: "../portfolio-api.yaml#/components/responses/BadRequest"

history_overall:
  get:
    tags: [History]
    summary: Overall portfolio worth per day (stocks + gold, INR and EUR)
    description: |
      PD-059. Daily points from portfolio_overall plus the physical-gold
      overlay, for the Overview performance chart. Amounts are absent, never
      zero, on a day without a rate, on a day whose gold has no price yet,
      and on every day when gold cannot be read for a gold-enabled account.
    operationId: getOverallHistory
    parameters:
      - name: from
        in: query
        required: true
        schema:
          type: string
          format: date
      - name: to
        in: query
        required: true
        schema:
          type: string
          format: date
    responses:
      "200":
        description: Daily points, oldest first
        content:
          application/json:
            schema:
              $ref: "../portfolio-api.yaml#/components/schemas/OverallHistory"
      "400":
        $ref: "../portfolio-api.yaml#/components/responses/BadRequest"

history_fx_missing:
  get:
    tags: [History]
    summary: The caller's days with a fallback or missing EUR→INR rate
    description: |
      PD-059 (DD-015 §2.7). Days whose portfolio_overall rate is flagged
      (fx_carried): a fallback after a failed fetch, or no rate yet. History
      offers to re-fetch them. Own portfolio only; act-as has no route here.
    operationId: getFxMissing
    responses:
      "200":
        description: Flagged days, newest first
        content:
          application/json:
            schema:
              $ref: "../portfolio-api.yaml#/components/schemas/FxDates"

history_fx_refetch:
  post:
    tags: [History]
    summary: Re-fetch the EUR→INR rate for flagged days
    description: |
      PD-059 (DD-015 §2.7). Fetches the rate of each requested day that is
      still flagged (one Yahoo call; the live quote for the current trading
      day), rewrites the day's rate and stock totals and clears its flag.
      Days that are not flagged are ignored. A failed fetch is not an
      error: the response lists the days that stay flagged.
    operationId: refetchFx
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../portfolio-api.yaml#/components/schemas/FxDates"
    responses:
      "200":
        description: The requested days still flagged, newest first
        content:
          application/json:
            schema:
              $ref: "../portfolio-api.yaml#/components/schemas/FxDates"
      "400":
        $ref: "../portfolio-api.yaml#/components/responses/BadRequest"

---
# `pre-commit install` installs both stages, so the commit-msg rule check
# below runs for every commit without a second install step.
default_install_hook_types: [pre-commit, commit-msg]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # Block committing straight to main; work on a branch and open a PR.
      - id: no-commit-to-branch
        args: [--branch, main]
  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.37.1
    hooks:
      - id: yamllint
        args: [--format, parsable]
        entry: yamllint -c .yamllint
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.45.0
    hooks:
      - id: markdownlint-fix
  - repo: local
    hooks:
      - id: go-fmt
        name: gofmt
        entry: gofmt -l -w .
        language: system
        types: [go]
  - repo: local
    hooks:
      - id: golangci-lint
        name: golangci-lint
        entry: bash -c 'cd backend && golangci-lint run --timeout=1m ./...'
        language: system
        types: [go]
        pass_filenames: false
  - repo: local
    hooks:
      # CLAUDE.md "Project rules": gitmoji prefix, subject <= 50 chars after
      # the emoji, no AI attribution. Shared logic: scripts/rules/lib.sh.
      - id: commit-msg-rules
        name: commit message rules
        entry: scripts/rules/check-commit-msg.sh
        language: system
        stages: [commit-msg]

---
name: Deploy backend to Cloud Run (dev)

# Label-triggered dev deploys (PD-044): adding the `dev` label to a PR
# deploys that PR's head branch to the dev Cloud Run service; every push to
# a labeled PR re-deploys. One shared dev stack — the newest labeled deploy
# wins. Prod deploys (deploy-cloudrun.yml, on main) are untouched.
#
# Dev isolation without new secrets:
#   - Mongo: same Atlas cluster / MONGODB_URI secret, but
#     MONGODB_DATABASE=portfolio_dev (the DB name comes from the env var,
#     not the URI).
#   - Postgres (gold, DD-003): wired only when a POSTGRES_URI_DEV secret
#     exists in Secret Manager (Neon dev branch). Until then the backend
#     boots with gold features disabled — that degrade path is by design.

on:
  pull_request:
    types: [labeled, synchronize, reopened]

permissions:
  contents: read
  id-token: write
  pull-requests: write  # comment the dev URL on the PR

env:
  SERVICE: portfolio-dashboard-api-dev
  REGION: europe-west1

concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  deploy-dev:
    # Label is the approval gate (triage+ collaborators only). Fork PRs are
    # excluded — WIF secrets don't flow to forks anyway.
    if: >-
      contains(github.event.pull_request.labels.*.name, 'dev') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - id: auth
        name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run (dev)
        run: |
          SECRETS="MONGODB_URI=MONGODB_URI:latest"
          # Gold storage (DD-003) is optional on dev until the Neon dev
          # branch exists; the backend degrades to gold-disabled without it.
          if gcloud secrets describe POSTGRES_URI_DEV >/dev/null 2>&1; then
            SECRETS="$SECRETS,POSTGRES_URI=POSTGRES_URI_DEV:latest"
          else
            echo "POSTGRES_URI_DEV secret not found — deploying without gold storage"
          fi
          gcloud run deploy "$SERVICE" \
            --source backend \
            --region "$REGION" \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --min-instances 0 \
            --max-instances 1 \
            --memory 512Mi \
            --cpu 1 \
            --timeout 60s \
            --set-env-vars "^##^LOG_FORMAT=json##LOG_LEVEL=info##COOKIE_SECURE=true##MONGODB_DATABASE=portfolio_dev##CORS_ALLOWED_ORIGINS=${{ secrets.CORS_ALLOWED_ORIGINS_DEV || secrets.CORS_ALLOWED_ORIGINS }}" \
            --set-secrets "$SECRETS"

      - name: Comment dev URL on the PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          URL=$(gcloud run services describe "$SERVICE" --region "$REGION" \
            --format 'value(status.url)')
          gh pr comment "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --body "🚀 Deployed \`${{ github.event.pull_request.head.sha }}\` to the dev stack: $URL (Mongo db \`portfolio_dev\`)"

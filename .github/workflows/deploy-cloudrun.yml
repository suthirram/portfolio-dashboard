name: Deploy backend to Cloud Run

# Builds the Go API from backend/Dockerfile (via Cloud Build) and deploys it to
# Cloud Run. Auth is keyless via Workload Identity Federation — no JSON key in
# the repo. One-time GCP + GitHub setup: docs/plans/PD-029-cloud-run-deploy.md.

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-cloudrun.yml'
  workflow_dispatch:

# Least privilege: read the repo, mint an OIDC token for WIF. Nothing else.
permissions:
  contents: read
  id-token: write

env:
  SERVICE: portfolio-dashboard-api
  REGION: europe-west1

concurrency:
  group: deploy-cloudrun
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$SERVICE" \
            --source backend \
            --region "$REGION" \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --min-instances 0 \
            --max-instances 4 \
            --memory 512Mi \
            --cpu 1 \
            --timeout 60s \
            --set-env-vars "^##^LOG_FORMAT=json##LOG_LEVEL=info##COOKIE_SECURE=true##MONGODB_DATABASE=portfolio##CORS_ALLOWED_ORIGINS=${{ secrets.CORS_ALLOWED_ORIGINS }}" \
            --set-secrets "MONGODB_URI=MONGODB_URI:latest"

      - name: Repoint snapshot job to the freshly deployed image
        # pd-snapshot is a separate Cloud Run Job that runs the same binary as
        # the service. Pin it to the same image so the cron and the web app
        # always run identical code.
        run: |
          IMAGE=$(gcloud run services describe "$SERVICE" --region "$REGION" \
            --format 'value(spec.template.spec.containers[0].image)')
          echo "Repointing pd-snapshot to $IMAGE"
          gcloud run jobs update pd-snapshot --region "$REGION" --image "$IMAGE"

      - name: Show service URL
        run: |
          gcloud run services describe "$SERVICE" --region "$REGION" \
            --format 'value(status.url)'

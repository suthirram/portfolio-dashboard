---
name: lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go (gofmt + golangci-lint + go test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: backend/go.sum
      - name: gofmt
        working-directory: backend
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: latest
          working-directory: backend
          args: --timeout=2m
      # Unit tests use mongo-driver mtest mocks; Postgres-backed tests
      # t.Skip themselves when no local Postgres is reachable, so no DB
      # services are needed on the runner.
      - name: go test
        working-directory: backend
        run: go test -race ./...
      # Logging convention (CLAUDE.md): bind `logger := s.log(ctx)` and call
      # logger.Error(...) — never chain s.log(ctx).Error(...) inline.
      - name: logging convention
        working-directory: backend
        run: |
          if grep -rnE '\.log\((ctx)?\)\.' --include='*.go' . | grep -v _test.go; then
            echo "Chained .log(ctx).X calls found — bind 'logger := s.log(ctx)' instead (see CLAUDE.md)."
            exit 1
          fi

  frontend:
    name: Frontend (tsc + vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # `npm install` (not `npm ci`) so cross-platform optional binaries —
      # e.g. esbuild's per-OS @esbuild/<os>-<arch> packages — don't trip the
      # strict EBADPLATFORM check on Linux runners. The lockfile is still
      # respected for version pinning.
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run test:run

  markdown:
    name: Markdown (markdownlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install -g markdownlint-cli@0.45.0
      - run: markdownlint '**/*.md' --ignore node_modules --config .markdownlintrc

  yaml:
    name: YAML (yamllint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install yamllint==1.37.1
      - run: yamllint -c .yamllint .
